# ============================================================
# Production Redis Configuration for n8n Queue Mode
# ============================================================

# ── Network ──────────────────────────────────────────────────
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ── General ──────────────────────────────────────────────────
daemonize no
loglevel notice
databases 16

# ── Persistence: AOF (durable) + RDB (snapshot backup) ───────
# AOF is the primary durability mechanism. Snapshots act as a
# safety net. This replaces the default "100 changes in 300s"
# trigger that was flooding logs.
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB snapshots (less frequent — just a backup)
save 3600 1
save 300 100
save 60 10000
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb

# ── Memory ───────────────────────────────────────────────────
# Set a memory ceiling; when hit, evict oldest queue data first.
# Adjust maxmemory to ~50% of the host RAM available to Docker.
maxmemory 256mb
maxmemory-policy allkeys-lru

# ── Performance ──────────────────────────────────────────────
hz 10
dynamic-hz yes
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# ── Slow Log (for operational visibility) ────────────────────
slowlog-log-slower-than 10000
slowlog-max-len 128

# ── Clients ──────────────────────────────────────────────────
maxclients 256
