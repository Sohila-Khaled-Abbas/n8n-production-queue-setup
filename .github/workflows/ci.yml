name: CI Code Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  python-lint:
    name: Python Linting & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Lint Check
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

  docker-lint:
    name: Dockerfile Linting (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lint Main Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Lint Runner Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.runner
          failure-threshold: error

      - name: Lint Autoscaler Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: autoscaler/Dockerfile
          failure-threshold: error

      - name: Lint Monitor Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: monitor/monitor.Dockerfile
          failure-threshold: error


  v3-compose-config:
    name: Validate v3 Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare dummy non-production environment
        run: |
          cp .env.example .env
          printf '\nCOMPOSE_PROJECT_NAME=n8n\n' >> .env
      - name: Validate configuration
        run: |
          docker compose --profile provision --profile autoscaling --profile integrations --profile monitoring config --quiet
          docker compose --profile provision --profile autoscaling --profile integrations --profile monitoring config --format json > /tmp/n8n-compose.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          compose = json.loads(Path('/tmp/n8n-compose.json').read_text())
          services = compose['services']
          assert services['n8n']['ports'][0]['host_ip'] == '127.0.0.1'
          assert services['n8n']['ports'][0]['published'] == '80'
          assert services['n8n-init']['image'].endswith(':3.0.1')
          assert 'provision' in services['n8n-init']['profiles']
          assert 'autoscaling' in services['n8n-autoscaler']['profiles']
          # Breaking-change settings must reach the shared n8n service.
          env = services['n8n']['environment']
          assert str(env['N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES']) == '268435456'
          assert str(env['N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES']) == '1000'
          assert str(env['N8N_UNVERIFIED_PACKAGES_ENABLED']).lower() == 'false'
          # Do not auto-enable deprecated Chat Hub.
          assert 'N8N_ENABLED_MODULES' not in env
          assert services['redis']['healthcheck']
          assert services['n8n']['build']['args']['N8N_VERSION'] == '3.0.1'
          assert services['n8n-runner']['build']['args']['N8N_VERSION'] == '3.0.1'
          print('Compose config and basic safety invariants OK')
          PY

  v3-custom-images:
    name: Build custom n8n v3 / runner images
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [v3-compose-config]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare dummy environment
        run: cp .env.example .env
      - name: Build v3 main and task runner
        run: docker compose build --pull n8n n8n-runner
      - name: Smoke test the core queue-mode stack with disposable CI data
        run: |
          docker compose up -d --no-build postgres redis n8n
          docker compose ps
          test "$(docker exec n8n-redis redis-cli ping | tr -d '\r')" = "PONG"
          docker exec n8n-main-server n8n --version | grep -x '3.0.1'
          docker compose up -d --no-build n8n-runner n8n-worker n8n-worker-runner
          docker compose ps
      - name: Debug failed local stack
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --no-color --tail=100 postgres redis n8n n8n-runner n8n-worker n8n-worker-runner || true
      - name: Stop disposable CI containers
        if: always()
        run: docker compose down || true
