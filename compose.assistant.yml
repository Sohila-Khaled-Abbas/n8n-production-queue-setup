# Opt-in n8n Assistant + OpenRouter + isolated local development sandbox.
# Usage: docker compose -f docker-compose.yml -f compose.assistant.yml ...
# Do not run this override until Redis/Postgres are healthy and the n8n version
# migration has been completed/verified. No existing service volumes are changed.
# Based on https://docs.n8n.io/deploy/host-n8n/install-options/install-using-docker-compose
# Sandbox release images must use the same N8N_SANDBOX_VERSION.
volumes:
  sandbox_tls:

services:
  n8n:
    environment:
      # Include ALL existing enabled modules in this comma-separated list.
      N8N_ENABLED_MODULES: ${N8N_ENABLED_MODULES:-instance-ai}
      N8N_INSTANCE_AI_MODEL: ${N8N_INSTANCE_AI_MODEL:-openrouter/openrouter/free}
      N8N_INSTANCE_AI_MODEL_API_KEY: ${N8N_INSTANCE_AI_MODEL_API_KEY:?Set a newly rotated OpenRouter key in your private .env}
      N8N_INSTANCE_AI_SANDBOX_ENABLED: "true"
      N8N_INSTANCE_AI_SANDBOX_PROVIDER: n8n-sandbox
      N8N_SANDBOX_SERVICE_URL: http://sandbox-api:8080
      N8N_SANDBOX_SERVICE_API_KEY: ${N8N_SANDBOX_SERVICE_API_KEY:?Set the same key as SANDBOX_API_KEYS}
      N8N_INSTANCE_AI_SEARXNG_URL: http://searxng:8080
    depends_on:
      sandbox-api:
        condition: service_healthy

  sandbox-certs:
    image: docker.io/n8nio/n8n-sandbox-service-api:${N8N_SANDBOX_VERSION:-1.13.0}
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command:
      - >-
        bootstrap-mtls.sh --out-dir /tls --api-san sandbox-api
        --control-san-prefix sandbox-runner --world-readable &&
        chown -R sandbox-api:sandbox-api /tls/api && chmod -R a+rX /tls
    environment:
      NUM_RUNNERS: "1"
    volumes:
      - sandbox_tls:/tls
    networks:
      - n8n-net
    restart: "no"

  sandbox-api:
    image: docker.io/n8nio/n8n-sandbox-service-api:${N8N_SANDBOX_VERSION:-1.13.0}
    restart: unless-stopped
    depends_on:
      sandbox-certs:
        condition: service_completed_successfully
    environment:
      # Do not use env_file: .env here: keep database / integration keys out
      # of the sandbox control plane.
      SANDBOX_API_KEYS: ${SANDBOX_API_KEYS:?Set API key in private .env}
      SANDBOX_API_RUNNER_REGISTRATION_TOKEN: ${SANDBOX_API_RUNNER_REGISTRATION_TOKEN:?Set registration token in private .env}
      SANDBOX_API_RUNNER_API_KEY: ${SANDBOX_API_RUNNER_API_KEY:?Set runner key in private .env}
      SANDBOX_API_GRPC_TLS_CERT_FILE: /tls/api/grpc-server.crt
      SANDBOX_API_GRPC_TLS_KEY_FILE: /tls/api/grpc-server.key
      SANDBOX_API_GRPC_TLS_CLIENT_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/api/control-grpc-api-client.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/api/control-grpc-api-client.key
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_SERVER_NAME: sandbox-runner-1
    volumes:
      - sandbox_tls:/tls:ro
    networks:
      - n8n-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    # Intentionally NO host ports; all access remains on n8n-net.

  sandbox-runner-1:
    image: docker.io/n8nio/n8n-sandbox-service-runner-dind:${N8N_SANDBOX_VERSION:-1.13.0}
    privileged: true # Required by upstream Docker-in-Docker local sandbox.
    restart: unless-stopped
    depends_on:
      sandbox-api:
        condition: service_healthy
    environment:
      SANDBOX_API_RUNNER_REGISTRATION_TOKEN: ${SANDBOX_API_RUNNER_REGISTRATION_TOKEN:?Set registration token in private .env}
      SANDBOX_API_RUNNER_API_KEY: ${SANDBOX_API_RUNNER_API_KEY:?Set runner key in private .env}
      SANDBOX_RUNNER_API_GRPC_ADDR: sandbox-api:9090
      SANDBOX_RUNNER_HTTP_BASE_URL: https://sandbox-runner-1:8080
      SANDBOX_RUNNER_CONTROL_GRPC_LISTEN_ADDR: ":9091"
      SANDBOX_RUNNER_CONTROL_GRPC_ADVERTISE_ADDR: sandbox-runner-1:9091
      SANDBOX_RUNNER_ID: runner-1
      SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE: docker.io/n8nio/n8n-sandbox-service-sandbox:${N8N_SANDBOX_VERSION:-1.13.0}
      SANDBOX_RUNNER_REGISTRATION_GRPC_CA_FILE: /tls/runner/ca.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_CERT_FILE: /tls/runner/grpc-client.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_KEY_FILE: /tls/runner/grpc-client.key
      SANDBOX_RUNNER_REGISTRATION_GRPC_SERVER_NAME: sandbox-api
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/runner/control-grpc-server.crt
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/runner/control-grpc-server.key
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CLIENT_CA_FILE: /tls/runner/ca.crt
    volumes:
      - sandbox_tls:/tls:ro
    networks:
      - n8n-net
    # Privileged engine; NEVER publish ports or mount the host Docker socket.

  searxng:
    image: ghcr.io/searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set search secret in private .env}
    volumes:
      - ./config/searxng-settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - n8n-net
    # No host ports. JSON search is enabled in config/searxng-settings.yml.
