<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>n8n Production Stack</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Marked.js & Mermaid.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@9.4.3/dist/mermaid.min.js"></script>
    
    <style>
        body { 
            background-color: #f8fafc; 
            color: #0f172a; 
            font-family: system-ui, -apple-system, sans-serif; 
        }
        
        /* Markdown Typography Styles */
        .prose h1 { font-size: 2.25rem; font-weight: 700; margin-bottom: 1.5rem; color: #0f172a; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.5rem; }
        .prose h2 { font-size: 1.5rem; font-weight: 600; margin-top: 2rem; margin-bottom: 1rem; color: #1e293b; }
        .prose h3 { font-size: 1.25rem; font-weight: 600; margin-top: 1.5rem; margin-bottom: 0.75rem; color: #334155; }
        .prose p { margin-bottom: 1.25rem; line-height: 1.7; color: #475569; }
        .prose ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1.25rem; color: #475569; }
        .prose li { margin-bottom: 0.5rem; }
        .prose a { color: #2563eb; text-decoration: none; }
        .prose a:hover { text-decoration: underline; }
        .prose strong { font-weight: 600; color: #0f172a; }
        .prose blockquote { border-left: 4px solid #cbd5e1; padding-left: 1rem; color: #64748b; font-style: italic; margin-bottom: 1.25rem; }
        
        /* Code Blocks */
        .prose pre { 
            background-color: #1e293b; 
            color: #f8fafc; 
            padding: 1.25rem; 
            border-radius: 0.5rem; 
            overflow-x: auto; 
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
        }
        .prose code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
        .prose p code, .prose li code { 
            background-color: #f1f5f9; 
            padding: 0.2rem 0.4rem; 
            border-radius: 0.25rem; 
            color: #ef4444; 
            font-size: 0.875em;
        }
        
        /* Sidebar Navigation */
        .nav-link { 
            cursor: pointer; 
            padding: 0.5rem 1rem; 
            border-radius: 0.375rem; 
            transition: all 0.2s; 
            color: #475569;
            font-weight: 500;
        }
        .nav-link:hover { 
            background-color: #f1f5f9; 
            color: #0f172a;
        }
        .nav-link.active { 
            background-color: #e0f2fe; 
            color: #0369a1; 
            font-weight: 600; 
        }
        
        /* Loading Spinner */
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex h-screen overflow-hidden">
    
    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col h-full shrink-0 shadow-sm z-10">
        <div class="p-6 border-b border-slate-100 flex items-center gap-3">
            <div class="w-8 h-8 rounded bg-red-500 text-white flex items-center justify-center font-bold text-xl shadow-sm shadow-red-500/20">N</div>
            <div>
                <div class="font-bold text-slate-800 leading-tight">n8n Hub</div>
                <div class="text-xs text-slate-400">Documentation</div>
            </div>
        </div>
        <nav class="p-4 space-y-1 flex-1 overflow-y-auto" id="sidebar-nav">
            <a class="nav-link block active" id="nav-workflows" onclick="showSection('workflows')">Workflows Directory</a>
            <div class="my-4 border-t border-slate-100"></div>
            <div class="px-4 mb-2 text-xs font-semibold text-slate-400 uppercase tracking-wider">Guides</div>
            <a class="nav-link block" id="nav-architecture" onclick="showSection('architecture')">Architecture & Design</a>
            <a class="nav-link block" id="nav-production_guide" onclick="showSection('production_guide')">Production Guide</a>
            <a class="nav-link block" id="nav-scripts" onclick="showSection('scripts')">Operational Scripts</a>
            <a class="nav-link block" id="nav-troubleshooting" onclick="showSection('troubleshooting')">Troubleshooting</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-8 lg:p-12" id="main-content">
        
        <!-- Loading Indicator -->
        <div id="loading" class="flex flex-col items-center justify-center h-full text-slate-500">
            <div class="loader mb-4"></div>
            <p>Loading compiled documentation...</p>
        </div>
        
        <!-- Workflows Grid Section -->
        <section id="section-workflows" class="hidden max-w-6xl mx-auto">
            <div class="flex items-end justify-between mb-8 pb-4 border-b border-slate-200">
                <div>
                    <h1 class="text-3xl font-bold text-slate-800">Workflows Directory</h1>
                    <p class="text-slate-500 mt-2">Browse the <span id="wf-count" class="font-bold text-slate-700">0</span> automation pipelines currently active in your deployment.</p>
                </div>
            </div>
            
            <div id="workflows-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6"></div>
        </section>

        <!-- Markdown Document Section -->
        <section id="section-markdown" class="hidden max-w-4xl mx-auto prose prose-slate">
            <!-- Content injected here -->
        </section>
        
    </main>

    <script>
        let dbData = null;
        
        async function init() {
            try {
                const res = await fetch('./data.json');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                
                dbData = await res.json();
                
                // Initialize Markdown parser
                marked.setOptions({ breaks: true, gfm: true });
                
                // Initialize Mermaid diagram renderer
                mermaid.initialize({ startOnLoad: false, theme: 'default' });
                
                document.getElementById('loading').style.display = 'none';
                renderWorkflows();
                showSection('workflows');
                
            } catch (err) {
                document.getElementById('loading').innerHTML = `
                    <div class="bg-red-50 border border-red-200 text-red-700 p-6 rounded-lg max-w-md text-center">
                        <svg class="w-12 h-12 text-red-400 mx-auto mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                        </svg>
                        <h3 class="font-bold text-lg mb-1">Failed to Load Database</h3>
                        <p class="text-sm">Could not load <code>data.json</code>. Did you run the Python generation script?</p>
                        <p class="text-xs text-red-500 mt-2 font-mono">${err.message}</p>
                    </div>
                `;
            }
        }
        
        function renderWorkflows() {
            const grid = document.getElementById('workflows-grid');
            document.getElementById('wf-count').textContent = dbData.workflows.length;
            
            grid.innerHTML = dbData.workflows.map(w => {
                const triggerType = w.triggers && w.triggers.length > 0 ? w.triggers[0].type : 'Manual';
                const nodeTypesList = (w.nodeTypes || []).slice(0, 3).map(t => 
                    `<span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded border border-slate-200 truncate max-w-[120px]">${t}</span>`
                ).join('');

                return `
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow flex flex-col h-full">
                    <div class="flex justify-between items-start mb-3">
                        <span class="text-[10px] font-bold uppercase tracking-wider ${w.active ? 'text-emerald-600 bg-emerald-50 border-emerald-200' : 'text-slate-500 bg-slate-50 border-slate-200'} px-2 py-1 rounded border">
                            ${w.active ? '● Active' : 'Inactive'}
                        </span>
                        <span class="text-xs font-mono font-bold text-slate-400 bg-slate-50 px-2 py-1 rounded border border-slate-100">
                            ${w.nodeCount} NODES
                        </span>
                    </div>
                    
                    <h3 class="font-bold text-slate-800 text-lg leading-tight mb-2">${w.name}</h3>
                    <p class="text-sm text-slate-500 line-clamp-3 mb-6 flex-1">${w.description || 'No description provided.'}</p>
                    
                    <div class="mt-auto pt-4 border-t border-slate-100">
                        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">Primary Trigger</div>
                        <span class="text-xs font-medium text-blue-700 bg-blue-50 px-2 py-1 rounded border border-blue-100 mb-3 inline-block">
                            ⚡ ${triggerType}
                        </span>
                        
                        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2 mt-2">Nodes</div>
                        <div class="flex flex-wrap gap-1.5">
                            ${nodeTypesList}
                            ${w.nodeTypes.length > 3 ? `<span class="text-xs text-slate-400 px-1 py-0.5">+${w.nodeTypes.length - 3}</span>` : ''}
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }
        
        function showSection(id) {
            // Hide all sections
            document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
            
            // Remove active state from all links
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            
            // Set active state on clicked link
            const navElement = document.getElementById('nav-' + id);
            if (navElement) navElement.classList.add('active');
            
            if (id === 'workflows') {
                document.getElementById('section-workflows').classList.remove('hidden');
            } else {
                const mdSection = document.getElementById('section-markdown');
                mdSection.classList.remove('hidden');
                
                let content = dbData.guides[id] || '';
                
                // Specifically for architecture, prepend the infographic diagram if available
                if (id === 'architecture' && dbData.guides.infographic) {
                    content = dbData.guides.infographic + '\n\n---\n\n' + content;
                }
                
                // Handle GitHub alert blocks
                content = content.replace(/> \[!(.*?)\]\n(> .*?(?:\n> .*?)*)/g, (match, type, text) => {
                    const cleanText = text.replace(/^> /gm, '');
                    let color = 'blue';
                    if (type === 'NOTE') color = 'blue';
                    else if (type === 'TIP') color = 'emerald';
                    else if (type === 'IMPORTANT') color = 'purple';
                    else if (type === 'WARNING') color = 'orange';
                    else if (type === 'CAUTION') color = 'red';
                    
                    return `<div class="bg-${color}-50 border-l-4 border-${color}-500 p-4 my-4 rounded-r-md">
                        <div class="font-bold text-${color}-800 text-sm tracking-wider uppercase mb-1">${type}</div>
                        <div class="text-${color}-900 text-sm">${marked.parse(cleanText)}</div>
                    </div>`;
                });
                
                // Parse markdown
                let html = marked.parse(content);
                
                // Convert marked code blocks to mermaid divs
                html = html.replace(/<pre><code class="language-mermaid">([\s\S]*?)<\/code><\/pre>/gi, '<div class="mermaid">$1</div>');
                
                mdSection.innerHTML = html;
                
                // Render mermaid diagrams
                setTimeout(() => {
                    try {
                        mermaid.init(undefined, document.querySelectorAll('.mermaid'));
                    } catch (e) {
                        console.error('Mermaid render error:', e);
                    }
                }, 100);
            }
        }
        
        // Start application
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
