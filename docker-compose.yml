volumes:
  postgres_data:
  redis_data:

networks:
  n8n-net:
    driver: bridge

services:

  # ──────────────────────────────────────────────────────────
  # PostgreSQL — Persistent workflow & credential storage
  # ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    networks:
      - n8n-net
    environment:
      - POSTGRES_USER=${DB_POSTGRESDB_USER}
      - POSTGRES_PASSWORD=${DB_POSTGRESDB_PASSWORD}
      - POSTGRES_DB=${DB_POSTGRESDB_DATABASE}
      # Tuning: reduce checkpoint pressure (was causing 21s checkpoints in logs)
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    command: >
      postgres
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c work_mem=16MB
        -c maintenance_work_mem=128MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c default_statistics_target=100
        -c max_connections=100
        -c wal_level=replica
        -c max_wal_size=2GB
        -c min_wal_size=512MB
        -c log_min_duration_statement=1000
        -c log_checkpoints=on
        -c log_connections=off
        -c log_disconnections=off
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${DB_POSTGRESDB_USER} -d ${DB_POSTGRESDB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ──────────────────────────────────────────────────────────
  # Redis — Bull queue broker for queue-mode execution
  # ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: n8n-redis
    restart: unless-stopped
    networks:
      - n8n-net
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ──────────────────────────────────────────────────────────
  # n8n Main — Editor UI, REST API, and task broker
  # ──────────────────────────────────────────────────────────
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.25.6
    container_name: n8n-main
    restart: unless-stopped
    networks:
      - n8n-net
    ports:
      - "80:5678"
    env_file:
      - .env
    environment:
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      # Fix deprecation: route manual executions to workers
      - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
      # Fix deprecation: remove N8N_RUNNERS_ENABLED (no longer needed)
      # Suppress MCP registry external call timeouts
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      # Performance: limit payload size that triggers truncation warning
      - N8N_PAYLOAD_SIZE_MAX=256
    volumes:
      - ${N8N_DATA_DIR:-./n8n-data}:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ──────────────────────────────────────────────────────────
  # n8n Worker — Executes queued workflows
  # Scale horizontally: docker compose up --scale n8n-worker=3
  # ──────────────────────────────────────────────────────────
  n8n-worker:
    image: docker.n8n.io/n8nio/n8n:2.25.6
    container_name: n8n-worker-1
    restart: unless-stopped
    command: worker
    networks:
      - n8n-net
    env_file:
      - .env
    environment:
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - N8N_RUNNERS_MODE=external
      # Worker points to main's task broker
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
    volumes:
      - ${N8N_DATA_DIR:-./n8n-data}:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      n8n:
        condition: service_started

  # ──────────────────────────────────────────────────────────
  # n8n Python/JS Runner — External task runner sidecar
  # Executes Code node sandboxes (Python + JavaScript)
  # ──────────────────────────────────────────────────────────
  n8n-python-runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    container_name: n8n-python-runner
    restart: unless-stopped
    networks:
      - n8n-net
    env_file:
      - .env
    environment:
      # URI of the task broker port on the main n8n instance
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      # Increase handshake timeout to avoid i/o timeout errors seen in logs
      - N8N_RUNNERS_LAUNCHER_HEARTBEAT_INTERVAL=30
      - N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT=0
    volumes:
      - ${N8N_DATA_DIR:-./n8n-data}:/home/node/.n8n
      - ./n8n-task-runners.json:/etc/n8n-task-runners.json:ro
    depends_on:
      - n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5680/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
