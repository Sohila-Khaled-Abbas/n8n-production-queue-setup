volumes:
  postgres_data:
  redis_data:
  qdrant_storage:
  backup_data:
  waha_sessions:


networks:
  n8n-net:
    driver: bridge

# ── Centralized log rotation (configurable via .env) ──────────
x-logging: &default-logging
  driver: ${LOG_DRIVER:-json-file}
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}

# ── Shared n8n service template ───────────────────────────────
x-n8n: &service-n8n
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  logging: *default-logging
  networks:
    - n8n-net
  extra_hosts:
    - "host.docker.internal:host-gateway"
  dns:
    - 8.8.8.8
    - 1.1.1.1
  environment: &n8n-env
    # Routing & URLs
    N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL}
    WEBHOOK_URL: ${WEBHOOK_URL}
    N8N_PROXY_HOPS: ${N8N_PROXY_HOPS:-1}
    NODE_OPTIONS: --require /polyfills/dommatrix.js --dns-result-order=ipv4first
    # Security
    N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
    N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
    N8N_RUNNERS_GRANT_TOKEN_TTL: ${N8N_RUNNERS_GRANT_TOKEN_TTL:-600}
    N8N_RUNNERS_TASK_REQUEST_TIMEOUT: ${N8N_RUNNERS_TASK_REQUEST_TIMEOUT:-120}
    N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE: ${N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE:-true}
    N8N_COMMUNITY_PACKAGES_ENABLED: "true"
    N8N_SKIP_AUTH_ON_OAUTH_CALLBACK: ${N8N_SKIP_AUTH_ON_OAUTH_CALLBACK:-true}
    N8N_RUNNERS_ALLOW_PROTOTYPE_MUTATION: "true"
    N8N_RUNNERS_INSECURE_MODE: "true"
    # Database
    DB_TYPE: ${DB_TYPE:-postgresdb}
    DB_POSTGRESDB_HOST: ${DB_POSTGRESDB_HOST:-postgres}
    DB_POSTGRESDB_PORT: ${DB_POSTGRESDB_PORT:-5432}
    DB_POSTGRESDB_DATABASE: ${DB_POSTGRESDB_DATABASE}
    DB_POSTGRESDB_USER: ${DB_POSTGRESDB_USER}
    DB_POSTGRESDB_PASSWORD: ${DB_POSTGRESDB_PASSWORD}
    DB_POSTGRESDB_POOL_SIZE: ${DB_POSTGRESDB_POOL_SIZE:-10}
    DB_POSTGRESDB_CONNECTION_TIMEOUT: ${DB_POSTGRESDB_CONNECTION_TIMEOUT:-60000}
    # Queue mode
    EXECUTIONS_MODE: queue
    QUEUE_BULL_REDIS_HOST: redis
    QUEUE_BULL_REDIS_PORT: 6379
    QUEUE_HEALTH_CHECK_ACTIVE: "true"
    N8N_QUEUE_BULL_GRACEFULSHUTDOWNTIMEOUT: ${N8N_QUEUE_BULL_GRACEFULSHUTDOWNTIMEOUT:-300}
    N8N_GRACEFUL_SHUTDOWN_TIMEOUT: ${N8N_GRACEFUL_SHUTDOWN_TIMEOUT:-300}
    # Offload all executions (including manual) to workers
    OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
    # Task runner (n8n 2.0 external mode)
    N8N_RUNNERS_MODE: external
    N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
    # Execution data
    EXECUTIONS_DATA_PRUNE: ${EXECUTIONS_DATA_PRUNE:-true}
    EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE:-168}
    EXECUTIONS_DATA_PRUNE_MAX_COUNT: ${EXECUTIONS_DATA_PRUNE_MAX_COUNT:-5000}
    EXECUTIONS_DATA_SAVE_ON_SUCCESS: ${EXECUTIONS_DATA_SAVE_ON_SUCCESS:-all}
    EXECUTIONS_DATA_SAVE_ON_ERROR: ${EXECUTIONS_DATA_SAVE_ON_ERROR:-all}
    EXECUTIONS_DATA_SAVE_ON_PROGRESS: ${EXECUTIONS_DATA_SAVE_ON_PROGRESS:-false}
    # Binary data
    N8N_DEFAULT_BINARY_DATA_MODE: ${N8N_DEFAULT_BINARY_DATA_MODE:-database}
    # Diagnostics
    N8N_DIAGNOSTICS_ENABLED: "false"
    N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
    # Logging
    N8N_LOG_LEVEL: ${N8N_LOG_LEVEL:-info}
    N8N_LOG_OUTPUT: ${N8N_LOG_OUTPUT:-console}
    # AI
    OLLAMA_HOST: ${OLLAMA_HOST:-ollama:11434}

# ── Shared task runner template ───────────────────────────────
x-task-runner: &service-task-runner
  build:
    context: .
    dockerfile: Dockerfile.runner
  restart: unless-stopped
  logging: *default-logging
  networks:
    - n8n-net
  extra_hosts:
    - "host.docker.internal:host-gateway"
  dns:
    - 8.8.8.8
    - 1.1.1.1
  environment:
    - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
    - N8N_RUNNERS_GRANT_TOKEN_TTL=${N8N_RUNNERS_GRANT_TOKEN_TTL:-600}
    - N8N_RUNNERS_MAX_CONCURRENCY=${N8N_RUNNERS_MAX_CONCURRENCY:-5}
    - N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT=${N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT:-0}
    - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
    - PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=/usr/bin/chromium-browser
    - N8N_RUNNERS_ALLOW_PROTOTYPE_MUTATION=true
    - N8N_RUNNERS_INSECURE_MODE=true

services:

  # ──────────────────────────────────────────────────────────
  # PostgreSQL — Persistent workflow & credential storage
  # ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *default-logging
    networks:
      - n8n-net
    environment:
      - POSTGRES_USER=${DB_POSTGRESDB_USER}
      - POSTGRES_PASSWORD=${DB_POSTGRESDB_PASSWORD}
      - POSTGRES_DB=${DB_POSTGRESDB_DATABASE}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    command: >
      postgres
        -c shared_buffers=128MB
        -c effective_cache_size=384MB
        -c work_mem=8MB
        -c maintenance_work_mem=64MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=8MB
        -c default_statistics_target=100
        -c max_connections=40
        -c wal_level=replica
        -c max_wal_size=512MB
        -c min_wal_size=80MB
        -c synchronous_commit=off
        -c fsync=on
        -c full_page_writes=on
        -c log_min_duration_statement=2000
        -c log_checkpoints=on
        -c log_connections=off
        -c log_disconnections=off
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      # ⚠️ postgres_data is a Docker named volume — your data lives here.
      # This is NEVER deleted by docker compose operations.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${DB_POSTGRESDB_USER} -d ${DB_POSTGRESDB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ──────────────────────────────────────────────────────────
  # Redis — Bull queue broker (unauthenticated, internal only)
  # ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: n8n-redis
    restart: unless-stopped
    stop_grace_period: 20s
    logging: *default-logging
    networks:
      - n8n-net
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ──────────────────────────────────────────────────────────
  # n8n Main — Editor UI, REST API, task broker
  # ──────────────────────────────────────────────────────────
  n8n:
    <<: *service-n8n
    container_name: n8n-main-server
    environment:
      <<: *n8n-env
    stop_grace_period: 30s
    ports:
      - "80:5678"
    deploy:
      resources:
        limits:
          memory: 1024M
    volumes:
      # ⚠️ ./n8n-data is your existing bind-mount — data preserved here
      - ${N8N_DATA_DIR:-./n8n-data}:/home/node/.n8n
      # DOMMatrix polyfill: fixes pdfjs-dist PDF parsing in Node.js
      - ./polyfills:/polyfills:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  # ──────────────────────────────────────────────────────────
  # n8n Runner — Task runner sidecar for main instance
  # ──────────────────────────────────────────────────────────
  n8n-runner:
    <<: *service-task-runner
    container_name: n8n-runner
    environment:
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      - N8N_RUNNERS_MAX_CONCURRENCY=${N8N_RUNNERS_MAX_CONCURRENCY:-5}
      - N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT=${N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT:-0}
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
      - PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=/usr/bin/chromium-browser
      - N8N_RUNNERS_ALLOW_PROTOTYPE_MUTATION=true
      - N8N_RUNNERS_INSECURE_MODE=true
    depends_on:
      n8n:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'node.*runner' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ──────────────────────────────────────────────────────────
  # n8n Webhook — Dedicated webhook processor
  # ──────────────────────────────────────────────────────────
  n8n-webhook:
    <<: *service-n8n
    container_name: n8n-webhook
    stop_grace_period: 30s
    command: webhook
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - ${N8N_DATA_DIR:-./n8n-data}:/home/node/.n8n
      - ./polyfills:/polyfills:ro
    depends_on:
      n8n:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ──────────────────────────────────────────────────────────
  # n8n Worker — Executes queued workflows (autoscaled)
  # DO NOT set container_name — autoscaler scales this dynamically
  # ──────────────────────────────────────────────────────────
  n8n-worker:
    <<: *service-n8n
    stop_grace_period: 5m
    command: worker
    deploy:
      resources:
        limits:
          memory: 1024M
    volumes:
      - ${N8N_DATA_DIR:-./n8n-data}:/home/node/.n8n
      - ./polyfills:/polyfills:ro
    depends_on:
      n8n:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:5679/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ──────────────────────────────────────────────────────────
  # n8n Worker Runner — Task runner sidecar (autoscaled 1:1 with workers)
  # ──────────────────────────────────────────────────────────
  n8n-worker-runner:
    <<: *service-task-runner
    environment:
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n-worker:5679
      - N8N_RUNNERS_MAX_CONCURRENCY=${N8N_RUNNERS_MAX_CONCURRENCY:-5}
      - N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT=${N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT:-0}
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
      - PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=/usr/bin/chromium-browser
      - N8N_RUNNERS_ALLOW_PROTOTYPE_MUTATION=true
      - N8N_RUNNERS_INSECURE_MODE=true
    depends_on:
      n8n-worker:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'node.*runner' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ──────────────────────────────────────────────────────────
  # n8n Autoscaler — Monitors Redis queue, scales workers
  # ──────────────────────────────────────────────────────────
  n8n-autoscaler:
    build:
      context: .
      dockerfile: autoscaler/Dockerfile
    container_name: n8n-autoscaler
    restart: unless-stopped
    logging: *default-logging
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - QUEUE_NAME_PREFIX=${QUEUE_NAME_PREFIX:-bull}
      - QUEUE_NAME=${QUEUE_NAME:-jobs}
      - N8N_WORKER_SERVICE_NAME=${N8N_WORKER_SERVICE_NAME:-n8n-worker}
      - N8N_WORKER_RUNNER_SERVICE_NAME=${N8N_WORKER_RUNNER_SERVICE_NAME:-n8n-worker-runner}
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}
      - COMPOSE_FILE_PATH=/app/docker-compose.yml
      - MIN_REPLICAS=${MIN_REPLICAS:-1}
      - MAX_REPLICAS=${MAX_REPLICAS:-5}
      - SCALE_UP_QUEUE_THRESHOLD=${SCALE_UP_QUEUE_THRESHOLD:-5}
      - SCALE_DOWN_QUEUE_THRESHOLD=${SCALE_DOWN_QUEUE_THRESHOLD:-1}
      - POLLING_INTERVAL_SECONDS=${POLLING_INTERVAL_SECONDS:-10}
      - COOLDOWN_PERIOD_SECONDS=${COOLDOWN_PERIOD_SECONDS:-10}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      - ./.env:/app/.env
    depends_on:
      redis:
        condition: service_healthy
      n8n-worker:
        condition: service_started
    networks:
      - n8n-net

  # ──────────────────────────────────────────────────────────
  # Redis Monitor — Logs queue depth continuously
  # ──────────────────────────────────────────────────────────
  redis-monitor:
    build:
      context: .
      dockerfile: monitor/monitor.Dockerfile
    container_name: n8n-redis-monitor
    restart: unless-stopped
    logging: *default-logging
    networks:
      - n8n-net
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - QUEUE_NAME_PREFIX=${QUEUE_NAME_PREFIX:-bull}
      - QUEUE_NAME=${QUEUE_NAME:-jobs}
      - POLL_INTERVAL_SECONDS=${POLL_INTERVAL_SECONDS:-5}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy

  # ──────────────────────────────────────────────────────────
  # n8n Init — One-shot credential provisioner
  # ──────────────────────────────────────────────────────────
  n8n-init:
    image: docker.n8n.io/n8nio/n8n:2.28.6
    container_name: n8n-init
    restart: "no"
    networks:
      - n8n-net
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    entrypoint: ["node", "/scripts/provision.js"]
    volumes:
      - ./scripts:/scripts:ro
      - ${N8N_DATA_DIR:-./n8n-data}:/home/node/.n8n
    depends_on:
      n8n:
        condition: service_healthy

  # ──────────────────────────────────────────────────────────
  # n8n Backup — Scheduled backups (optional, use profile)
  # Enable with: docker compose --profile backup up -d
  # ──────────────────────────────────────────────────────────
  n8n-backup:
    profiles: [backup]
    build:
      context: .
      dockerfile: backup/Dockerfile
    container_name: n8n-backup
    restart: unless-stopped
    logging: *default-logging
    networks:
      - n8n-net
    volumes:
      - ${N8N_DATA_DIR:-./n8n-data}:/data/n8n:ro
      - redis_data:/data/redis:ro
      - backup_data:/backups
      # Uncomment after creating backup/rclone.conf from backup/rclone.conf.example:
      # - ./backup/rclone.conf:/config/rclone/rclone.conf:ro
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${DB_POSTGRESDB_DATABASE}
      - POSTGRES_USER=${DB_POSTGRESDB_USER}
      - POSTGRES_PASSWORD=${DB_POSTGRESDB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - BACKUP_SCHEDULE=${BACKUP_SCHEDULE:-0 2 * * *}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY:-}
      - BACKUP_RCLONE_DESTINATIONS=${BACKUP_RCLONE_DESTINATIONS:-}
      - BACKUP_RUN_ON_START=${BACKUP_RUN_ON_START:-false}
      - BACKUP_DELETE_LOCAL_AFTER_UPLOAD=${BACKUP_DELETE_LOCAL_AFTER_UPLOAD:-false}
      - BACKUP_WEBHOOK_URL=${BACKUP_WEBHOOK_URL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_TO=${SMTP_TO:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ──────────────────────────────────────────────────────────
  # Qdrant — High-performance vector database
  # ──────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    logging: *default-logging
    networks:
      - n8n-net
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  # ──────────────────────────────────────────────────────────
  # WAHA — WhatsApp HTTP API
  # ──────────────────────────────────────────────────────────
  waha:
    image: devlikeapro/waha:latest
    container_name: waha
    restart: unless-stopped
    logging: *default-logging
    networks:
      - n8n-net
    ports:
      - "3000:3000"
    environment:
      - WHATSAPP_API_KEY=${WAHA_API_KEY:-admin}
    volumes:
      - waha_sessions:/app/.sessions

