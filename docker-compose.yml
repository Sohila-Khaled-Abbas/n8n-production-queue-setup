version: '3.8'

volumes:
  postgres_data:
  redis_data:

services:

  # ──────────────────────────────────────────────────────────
  # PostgreSQL — Persistent workflow & credential storage
  # ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_POSTGRESDB_USER}
      - POSTGRES_PASSWORD=${DB_POSTGRESDB_PASSWORD}
      - POSTGRES_DB=${DB_POSTGRESDB_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${DB_POSTGRESDB_USER} -d ${DB_POSTGRESDB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────────────────────────
  # Redis — Bull queue broker for queue-mode execution
  # ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: n8n-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────────────────────────
  # n8n Main — Editor UI, REST API, and task broker
  # ──────────────────────────────────────────────────────────
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-main
    restart: unless-stopped
    ports:
      - "80:5678"          # HTTP editor/API
      # 5679 is bound internally for the task broker (not exposed externally)
    env_file:
      - .env
    environment:
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
    volumes:
      # Persistent n8n user data (workflows, credentials, binary files)
      # Adjust this host path to suit your environment.
      - ${N8N_DATA_DIR:-./n8n-data}:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ──────────────────────────────────────────────────────────
  # n8n Worker — Executes queued workflows
  # Scale horizontally: docker compose up --scale n8n-worker=3
  # ──────────────────────────────────────────────────────────
  n8n-worker:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-worker-1
    restart: unless-stopped
    command: worker
    env_file:
      - .env
    environment:
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
    volumes:
      # Must share the same volume as n8n-main for binary file access
      - ${N8N_DATA_DIR:-./n8n-data}:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ──────────────────────────────────────────────────────────
  # n8n Python/JS Runner — External task runner sidecar
  # Executes Code node sandboxes (Python + JavaScript)
  # ──────────────────────────────────────────────────────────
  n8n-python-runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    container_name: n8n-python-runner
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # URI of the task broker port on the main n8n instance
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
    volumes:
      # Share the data directory so runners can read/write files (CSV, Parquet, etc.)
      - ${N8N_DATA_DIR:-./n8n-data}:/home/node/.n8n
      # Mount the task runner config directly — no image rebuild needed for config changes
      - ./n8n-task-runners.json:/etc/n8n-task-runners.json:ro
    depends_on:
      - n8n
